<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: transparent; overflow: hidden;
               -webkit-user-select: none; user-select: none; cursor: default; }
  .pill {
    position: fixed; inset: 0;
    background: rgba(11, 10, 10, 0.72);
    border-radius: 8px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    display: flex; align-items: center; justify-content: center;
    opacity: 1;
    transition: opacity 240ms ease, background-color 160ms ease;
  }
  .pill.faded { opacity: 0; }
  .pill.error { background: rgba(236, 48, 19, 0.85); }

  .face {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; gap: 3px;
    opacity: 0; transition: opacity 120ms ease; pointer-events: none;
  }
  .face.on { opacity: 1; }

  .bar {
    width: 3px; height: 24px; border-radius: 1.5px;
    background: #f3f2f2;
    transform: scaleY(0.16); transform-origin: center;
    will-change: transform;
  }

  .status {
    font: 700 9px "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.18em;
    background: linear-gradient(100deg, #8a8a8a 40%, #ffffff 50%, #8a8a8a 60%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shim 1.6s linear infinite;
  }
  @keyframes shim {
    from { background-position: 140% 0; }
    to   { background-position: -40% 0; }
  }

  .check.on svg { animation: pop 280ms cubic-bezier(0.2, 1.6, 0.4, 1) both; }
  @keyframes pop {
    from { transform: scale(0.4); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .err {
    font: 600 10px "Segoe UI", system-ui, sans-serif;
    color: #ffffff; letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .face-stream {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: flex-start;
    opacity: 0; transition: opacity 120ms ease; pointer-events: none;
    padding-left: 12px; padding-right: 14px;
    box-sizing: border-box;
    overflow: hidden;
  }
  .face-stream.on { opacity: 1; }

  .stream-bars {
    display: flex; align-items: center; gap: 2.5px;
    flex-shrink: 0; margin-right: 10px;
  }

  .mini-bar {
    width: 2.5px; height: 16px; border-radius: 1.25px;
    background: #f3f2f2;
    transform: scaleY(0.25); transform-origin: center;
    will-change: transform;
  }

  .stream-text-wrap {
    flex: 1;
    overflow: hidden;
    display: flex;
    align-items: center;
  }
  .stream-text-wrap.faded-left {
    mask-image: linear-gradient(to right, transparent 0%, black 20px, black 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 20px, black 100%);
  }

  .stream-text {
    font: 500 12.5px "Segoe UI", system-ui, sans-serif;
    color: #f3f2f2;
    letter-spacing: 0.01em;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4.5px;
  }

  .word {
    display: inline-block;
    animation: wordFade 180ms ease-out;
  }
  @keyframes wordFade {
    from { opacity: 0; transform: translateX(4px); }
    to   { opacity: 1; transform: translateX(0); }
  }
</style>
</head>
<body>
  <div class="pill" id="pill">
    <div class="face" id="face-listening"></div>
    <div class="face-stream" id="face-streaming">
      <div class="stream-bars" id="stream-bars"></div>
      <div class="stream-text-wrap" id="stream-text-wrap">
        <div class="stream-text" id="stream-text"></div>
      </div>
    </div>
    <div class="face" id="face-processing"><span class="status">PROCESSING</span></div>
    <div class="face check" id="face-success">
      <svg viewBox="0 0 24 24" width="16" height="16">
        <path d="M4 12.5l5 5L20 6.5" stroke="#f3f2f2" stroke-width="3"
              fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="face" id="face-error"><span class="err" id="err-text"></span></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
